<template>
    <template lwc:if={hasError}>
        <div class="slds-box slds-theme_shade slds-m-around_small">
            <p class="slds-text-color_error">{errorMessage}</p>
        </div>
    </template>

    <template lwc:if={hasData}>
        <article class="slds-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <span class="slds-text-heading_small">Identity Verification</span>
                        </h2>
                        <p class="slds-text-body_small slds-text-color_weak">{customerName}</p>
                    </div>
                </header>
            </div>

            <div class="slds-card__body slds-card__body_inner">
                <ul class="slds-list_dotted">
                    <template for:each={checklist} for:item="item">
                        <li key={item} class="slds-item">{item}</li>
                    </template>
                </ul>
            </div>

            <footer class="slds-card__footer">
                <div class="slds-button-group" role="group">
                    <button class="slds-button slds-button_brand" onclick={handlePass}>Pass</button>
                    <button class="slds-button slds-button_destructive-text" onclick={handleFail}>Fail</button>
                    <button class="slds-button slds-button_neutral" onclick={handleDraftNote}>Draft note</button>
                </div>
            </footer>
        </article>
    </template>
</template>
